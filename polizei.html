   daher gilt dieselbe Anmeldung. Beide Dateien müssen vom selben Ursprung geladen werden
   (z. B. Live Server: http://127.0.0.1:5500/…).

   Aufbau:  1) CONFIG & Stammdaten   2) Store/Auth/DB (→ später Supabase)
            3) Helfer                4) Ansichten & Tabs   5) Aktionen   6) Init
   ===================================================================== */

/* ------------------------------------------------------------------
   1) CONFIG & STAMMDATEN
   ------------------------------------------------------------------ */
const CONFIG = {

// Akten (Tabelle `records`): Berichte, Festnahmen, Asservate/Beschlagnahmen, Vorstrafen
const REPORT_TYPES = ['Streifenbericht', 'Verkehrsunfall', 'Ermittlungsbericht', 'Einsatznachbereitung', 'Sonstiges'];
const SENTENCE_TYPES = ['Geldstrafe', 'Freiheitsstrafe', 'Freiheitsstrafe auf Bewährung', 'Fahrverbot / Führerscheinentzug', 'Gemeinnützige Arbeit'];

const SEIZE_STATUS = { sichergestellt: { label: 'In Verwahrung', cls: 'bg-amber-100 text-amber-800' }, zurueck: { label: 'Zurückgegeben', cls: 'bg-emerald-100 text-emerald-800' }, eingezogen: { label: 'Eingezogen', cls: 'bg-red-100 text-red-700' } };
const WARRANT_LEVELS = ['Aufenthaltsermittlung', 'Festnahme', 'Haftbefehl'];
// Bußgeldkatalog (fiktive RP-Beträge)
const OFFENSES = [

  { name: 'Rotlichtverstoß',                         fine: 150, type: 'Bußgeld' },
  { name: 'Fahren ohne Führerschein',                fine: 500, type: 'Anzeige' },
  { name: 'Fahrzeug ohne Zulassung / Kennzeichen',   fine: 300, type: 'Bußgeld' },
  { name: 'Verkehrsgefährdung / absichtliches Rammen (VDM)', fine: 400, type: 'Anzeige' },
  { name: 'Unfallflucht',                            fine: 600, type: 'Anzeige' },
  { name: 'Ruhestörung',                             fine: 80,  type: 'Verwarnung' },
  { name: 'Sachbeschädigung',                        fine: 200, type: 'Anzeige' },
  { name: 'Widerstand gegen Einsatzkräfte',          fine: 350, type: 'Anzeige' },

];

// Inhalte der öffentlichen Website (fiktiv). Eigene Pressemeldungen kommen aus dem Dienstbereich (Store „press“).
const SEED_PRESS = [
  { id: 'S1', ref: 'POL-NS-2026-014', date: '2026-11-13', tag: 'Verkehr', title: 'Schwerpunktkontrolle auf der Hauptstraße: Zahlreiche Verstöße festgestellt',
    text: 'Am Donnerstagabend haben Einsatzkräfte der Polizeiinspektion Saarbrücken-Mitte auf der Hauptstraße den Verkehr kontrolliert. Dabei wurden mehrere Geschwindigkeitsverstöße sowie Fahrten ohne gültige Zulassung festgestellt und geahndet.\n\nDie Landespolizei kündigt an, die Kontrollen im Stadtgebiet in den kommenden Wochen fortzusetzen. Ziel ist es, die Verkehrssicherheit für alle Verkehrsteilnehmer zu erhöhen.' },

  { name: 'Polizeipräsidium Saarbrücken (Hauptwache)', addr: 'Marktallee 1', phone: '555-0200', hours: 'Rund um die Uhr besetzt', note: 'Zentrale Leitstelle, Anzeigenaufnahme, Fundsachen' },

  { name: 'Pressestelle', addr: 'Marktallee 1', phone: '555-0240', hours: 'Mo–Fr 09–15 Uhr', note: 'Anfragen von Medien und Presseportal' }
];
const PRAEVENTION = [
  { t: 'Fahrzeugdiebstahl vorbeugen', lead: 'Die meisten Diebstähle sind vermeidbar.', tips: ['Fahrzeug immer abschließen und nie mit laufendem Motor verlassen.', 'In belebten, gut einsehbaren Bereichen parken.', 'Wertvolle Ladung nicht sichtbar im Fahrzeug lassen.', 'Diebstahl sofort über Onlinewache oder Notruf melden – die Fahndung beginnt dann umgehend.'] },
  { t: 'Verhalten bei Verkehrskontrollen', lead: 'Kontrollen dienen Ihrer Sicherheit.', tips: ['Blaulicht und Anhaltezeichen beachten, Fahrzeug sicher am Fahrbahnrand anhalten.', 'Führerschein und Fahrzeugpapiere bereithalten.', 'Ruhig bleiben und den Anweisungen der Beamten folgen.', 'Beschwerden bitte im Nachgang über die Onlinewache einreichen.'] },
  { t: 'Notruf richtig absetzen', lead: 'Im Ernstfall zählen Sekunden.', tips: ['Wo ist es passiert? (Straße, Hausnummer, Auffälligkeiten)', 'Was ist passiert? Wie viele Personen sind beteiligt oder verletzt?', 'Wer meldet? Name und Rückrufmöglichkeit nennen.', 'Warten Sie auf Rückfragen und legen Sie nicht eigenständig auf.'] },
  { t: 'Seriöse Geschäfte erkennen', lead: 'Betrug im Handel kommt vor.', tips: ['Nur bei Betrieben kaufen, die im Gewerberegister der Stadt eingetragen sind.', 'Misstrauisch werden bei auffällig günstigen Angeboten und Vorkasse.', 'Verdächtige Angebote der Polizei melden.'] }
];
const TAG_CLS = { Verkehr: 'bg-cop-100 text-cop-800', Zeugenaufruf: 'bg-red-100 text-red-700', 'Prävention': 'bg-emerald-100 text-emerald-800', Allgemein: 'bg-slate-100 text-slate-700' };


/* ------------------------------------------------------------------
   2) STORE / AUTH / DB   (🔌 SUPABASE: DB-Funktionen später durch supabase-Aufrufe ersetzen)
   ------------------------------------------------------------------ */
const Store = {
  get(k, f) { try { const v = JSON.parse(localStorage.getItem('np_' + k)); return v ?? f; } catch { return f; } },
  set(k, v) { try { localStorage.setItem('np_' + k, JSON.stringify(v)); return true; } catch { toast('Speicher voll.', 'error'); return false; } },
  del(k) { try { localStorage.removeItem('np_' + k); } catch {} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rid = n => Array.from({ length: n }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');

// identisch zum Bürgerportal, damit dieselben Konten funktionieren
async function hashPw(salt, pw) {
  const data = new TextEncoder().encode(salt + '::' + pw);
  if (window.crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const b of data) h = ((h << 5) + h + b) >>> 0;
  return 'x' + h.toString(16);
}

const Auth = {
  account() { const s = Store.get('session', null); return s ? (Store.get('accounts', []).find(a => a.id === s.accountId) || null) : null; },
  chars() { const a = this.account(); return a ? Store.get('characters', []).filter(c => c.accountId === a.id) : []; },
  active() { const s = Store.get('session', null); return s && s.charId ? (this.chars().find(c => c.id === s.charId) || null) : null; }
};
const rankIdx = r => RANKS.indexOf(r);

// Dienstverhältnis des angemeldeten Kontos (Tabelle `officers`)
const Cop = {
  officer() {
    const a = Auth.account(); if (!a) return null;
    const o = Store.get('officers', []).find(x => x.accountId === a.id); if (!o) return null;
    const c = Store.get('characters', []).find(x => x.id === o.charId); if (!c) return null;   // Charakter gelöscht → kein Zugang
    return { ...o, char: c, name: `${c.first} ${c.last}` };
  },
  need(min = 0) {
    const o = this.officer();
    if (!o) throw new Error('Kein Zugriff: Dienstzugang erforderlich.');
    if (rankIdx(o.rank) < min) throw new Error(`Dafür ist mindestens der Dienstgrad „${RANKS[min]}“ nötig.`);
    return o;
  }
};

const DB = {
  /* ----- Konto / Dienstzugang ----- */
  async login(username, password) {
    await sleep(400);
    const acc = Store.get('accounts', []).find(a => a.username.toLowerCase() === (username || '').trim().toLowerCase());
    if (!acc || acc.hash !== await hashPw(acc.salt, password || '')) throw new Error('Benutzername oder Passwort ist falsch.');
    Store.set('session', { accountId: acc.id, charId: null });
  },
  async logout() { Store.del('session'); },
  async activateDuty(charId, code) {                          // 🔌 Tabelle: officers (account_id, char_id, rank, badge)
    const acc = Auth.account(); if (!acc) throw new Error('Bitte anmelden.');
    if ((acc.status || 'approved') !== 'approved') throw new Error('Ihr Konto wurde noch nicht von der Verwaltung freigeschaltet.');
    const ch = Auth.chars().find(c => c.id === charId); if (!ch) throw new Error('Bitte wählen Sie einen Ihrer Charaktere als Dienstcharakter.');
    const c = (code || '').trim().toUpperCase();
    const rank = c === CONFIG.CODE_LEAD ? 'Dienststellenleiter' : c === CONFIG.CODE_OFFICER ? 'Polizeimeister' : null;
    if (!rank) throw new Error('Der Dienstcode ist ungültig.');
    const list = Store.get('officers', []);
    if (list.some(o => o.accountId === acc.id)) throw new Error('Für dieses Konto besteht bereits ein Dienstzugang.');
    list.push({ accountId: acc.id, charId: ch.id, rank, badge: this._badge(list), since: new Date().toISOString() });
    Store.set('officers', list);
  },
  _badge(list) { let b; do { b = 'PD-' + (Math.floor(Math.random() * 9000) + 1000); } while (list.some(o => o.badge === b)); return b; },

  /* ----- Register-Daten (nur lesen; gehören dem Bürgerportal) ----- */
  async getCharacters() { Cop.need(); return Store.get('characters', []); },
  async getVehicles()   { Cop.need(); return Store.get('vehicles', []); },
  async getLicenses()   { Cop.need(); return Store.get('licenses', {}); },
  async getBusinesses() { Cop.need(); return Store.get('businesses', []); },

  /* ----- Vorgänge / Bußgelder ----- 🔌 Tabelle: cases */
  async getCases() { Cop.need(); return Store.get('cases', []).sort((a, b) => b.createdAt.localeCompare(a.createdAt)); },
  async addCase(d) {
    const me = Cop.need(); await sleep(300);
    const ch = Store.get('characters', []).find(c => c.id === d.charId); if (!ch) throw new Error('Bitte wählen Sie eine Person aus dem Register.');
    const fine = Math.max(0, Math.round(+d.fine || 0));
    const x = { id: 'V-' + rid(6), type: d.type, charId: ch.id, charName: `${ch.first} ${ch.last}`, citizenId: ch.citizenId, plate: d.plate || '', offense: d.offense || '',
                text: d.text, fine, status: fine > 0 ? 'offen' : 'erfasst', by: `${me.rank} ${me.name}`, byAccount: me.accountId, badge: me.badge, createdAt: new Date().toISOString() };
    const l = Store.get('cases', []); l.push(x); Store.set('cases', l); return x;
  },
  async setCaseStatus(id, status) {
    Cop.need(status === 'erlassen' ? RANK_SENIOR : 0);
    const l = Store.get('cases', []), x = l.find(c => c.id === id); if (!x) throw new Error('Vorgang nicht gefunden.');
    x.status = status; Store.set('cases', l);
  },
  async removeCase(id) { Cop.need(RANK_LEAD); Store.set('cases', Store.get('cases', []).filter(c => c.id !== id)); },

  /* ----- Fahndung ----- 🔌 Tabelle: warrants; Fahrzeugfahndung = vehicles.status 'gestohlen' (wie im Bürgerportal) */
  async getWarrants() { Cop.need(); return Store.get('warrants', []).sort((a, b) => b.createdAt.localeCompare(a.createdAt)); },
  async addWarrant(d) {
    const me = Cop.need(RANK_SENIOR);
    const ch = Store.get('characters', []).find(c => c.id === d.charId); if (!ch) throw new Error('Bitte wählen Sie eine Person aus dem Register.');
    const l = Store.get('warrants', []);
    if (l.some(w => w.charId === ch.id && w.active)) throw new Error('Diese Person ist bereits zur Fahndung ausgeschrieben.');
    l.push({ id: 'F-' + rid(5), charId: ch.id, charName: `${ch.first} ${ch.last}`, citizenId: ch.citizenId, level: d.level, reason: d.reason, public: !!d.public, active: true, by: `${me.rank} ${me.name}`, createdAt: new Date().toISOString() });
    Store.set('warrants', l);
  },
  async closeWarrant(id) {
    const me = Cop.need(RANK_SENIOR); const l = Store.get('warrants', []), w = l.find(x => x.id === id); if (!w) return;
    w.active = false; w.closedBy = `${me.rank} ${me.name}`; w.closedAt = new Date().toISOString(); Store.set('warrants', l);
  },
  async setVehicleWanted(id, on, reason) {
    Cop.need(RANK_SENIOR); const l = Store.get('vehicles', []), v = l.find(x => x.id === id); if (!v) throw new Error('Fahrzeug nicht gefunden.');
    if (on) { v.status = 'gestohlen'; v.caseNo = 'AZ-' + rid(5); v.lastSeen = 'Polizei'; v.wantedReason = reason || ''; }
    else { v.status = 'ok'; v.caseNo = null; v.lastSeen = null; v.wantedReason = ''; }
    Store.set('vehicles', l);
  },

  /* ----- Akten: Berichte, Festnahmen, Asservate, Vorstrafen ----- 🔌 Tabelle: records (kind, char_id, title, text, …) */
  async getRecords(kind) { Cop.need(); return Store.get('records', []).filter(r => !kind || r.kind === kind).sort((a, b) => b.createdAt.localeCompare(a.createdAt)); },
  async addRecord(kind, d) {
    const me = Cop.need(kind === 'vorstrafe' ? RANK_SENIOR : 0); await sleep(250);
    const ch = d.charId ? Store.get('characters', []).find(c => c.id === d.charId) : null;
    if (d.charId && !ch) throw new Error('Person nicht im Register gefunden.');
    const need = (v, msg) => { if (!String(v || '').trim()) throw new Error(msg); };
    if (kind === 'bericht') { need(d.title, 'Bitte geben Sie einen Betreff an.'); need(d.text, 'Bitte schreiben Sie den Berichtstext.'); }
    else if (kind === 'festnahme') { if (!ch) throw new Error('Bitte wählen Sie die festgenommene Person aus dem Register.'); need(d.offense, 'Bitte geben Sie den Tatvorwurf an.'); need(d.text, 'Bitte schildern Sie den Hergang.'); }
    else if (kind === 'asservat') { need(d.items, 'Bitte nennen Sie die sichergestellten Gegenstände.'); need(d.text, 'Bitte geben Sie den Grund der Beschlagnahme an.'); }
    else if (kind === 'vorstrafe') { if (!ch) throw new Error('Bitte wählen Sie die verurteilte Person aus dem Register.'); need(d.offense, 'Bitte geben Sie die Straftat an.'); need(d.sentence, 'Bitte wählen Sie die Strafart.'); }
    else throw new Error('Unbekannte Aktenart.');
    const pre = { bericht: 'BE', festnahme: 'FN', asservat: 'AS', vorstrafe: 'VS' }[kind];
    const x = { id: `${pre}-${rid(5)}`, kind, sub: d.sub || '', title: (d.title || '').trim(), text: (d.text || '').trim(), location: d.location || '', offense: (d.offense || '').trim(),
      items: (d.items || '').trim(), storage: d.storage || '', plate: d.plate || '', sentence: d.sentence || '', sentenceDetail: (d.sentenceDetail || '').trim(), fileNo: (d.fileNo || '').trim(), date: d.date || new Date().toISOString().slice(0, 10),
      status: kind === 'asservat' ? 'sichergestellt' : 'erfasst', charId: ch ? ch.id : null, charName: ch ? `${ch.first} ${ch.last}` : '', citizenId: ch ? ch.citizenId : '',
      by: `${me.rank} ${me.name}`, byAccount: me.accountId, badge: me.badge, createdAt: new Date().toISOString() };
    const l = Store.get('records', []); l.push(x); Store.set('records', l);
    // Festnahme: bestehende Personenfahndung auf Wunsch beenden (nur ab Polizeimeister)
    if (kind === 'festnahme' && d.closeWarrant && ch && rankIdx(me.rank) >= RANK_SENIOR) {
      const w = Store.get('warrants', []); w.forEach(x2 => { if (x2.charId === ch.id && x2.active) { x2.active = false; x2.closedBy = `${me.rank} ${me.name}`; x2.closedAt = new Date().toISOString(); } }); Store.set('warrants', w);
    }
    return x;
  },
  async setRecordStatus(id, status) {                                  // Asservate: zurückgeben / einziehen
    Cop.need(RANK_SENIOR); if (!SEIZE_STATUS[status]) throw new Error('Ungültiger Status.');
    const l = Store.get('records', []), x = l.find(r => r.id === id); if (!x || x.kind !== 'asservat') throw new Error('Asservat nicht gefunden.');
    x.status = status; Store.set('records', l);
  },
  async removeRecord(id) { Cop.need(RANK_LEAD); Store.set('records', Store.get('records', []).filter(r => r.id !== id)); },

    /* ----- Onlinewache-Eingänge ----- 🔌 Tabelle: tips (no, type, location, text, name, status, notes[]) */
  async getTips() { Cop.need(); return Store.get('tips', []).sort((a, b) => b.createdAt.localeCompare(a.createdAt)); },
  async setTipStatus(no, status) {
    Cop.need(); const l = Store.get('tips', []), t = l.find(x => x.no === no); if (!t) throw new Error('Eingang nicht gefunden.');
    t.status = status; Store.set('tips', l);
  },
  async addTipNote(no, text, pub) {
    const me = Cop.need(); const l = Store.get('tips', []), t = l.find(x => x.no === no); if (!t) throw new Error('Eingang nicht gefunden.');
    t.notes = [...(t.notes || []), { text, public: !!pub, by: `${me.rank} ${me.name}`, at: new Date().toISOString() }]; Store.set('tips', l);
  },

  /* ----- Pressestelle ----- 🔌 Tabelle: press_releases */
  async getPress() { Cop.need(); return Public.getPress(); },
  async addPress(d) {
    const me = Cop.need(RANK_PRESS); const l = Store.get('press', []);

    Store.set('press', l);
  },
  async removePress(id) { Cop.need(RANK_PRESS); Store.set('press', Store.get('press', []).filter(p => p.id !== id)); },


  /* ----- Personal & Bewerbungen ----- */
  async getOfficers() {
    Cop.need(); const chars = Store.get('characters', []);
    return Store.get('officers', []).map(o => { const c = chars.find(x => x.id === o.charId); return c ? { ...o, char: c, name: `${c.first} ${c.last}` } : null; })
      .filter(Boolean).sort((a, b) => rankIdx(b.rank) - rankIdx(a.rank) || a.name.localeCompare(b.name, 'de'));
  },
  async setRank(accountId, rank) {
    const me = Cop.need(RANK_LEAD); if (!RANKS.includes(rank)) throw new Error('Ungültiger Dienstgrad.');
    if (accountId === me.accountId) throw new Error('Den eigenen Dienstgrad können Sie nicht ändern.');
    const l = Store.get('officers', []); l.find(o => o.accountId === accountId).rank = rank; Store.set('officers', l);
  },
  async removeOfficer(accountId) {
    const me = Cop.need(RANK_LEAD); if (accountId === me.accountId) throw new Error('Sie können sich nicht selbst entlassen.');
    Store.set('officers', Store.get('officers', []).filter(o => o.accountId !== accountId));
  },
  async getMyPoliceApplications() { const a = Auth.account(); return a ? Store.get('applications', []).filter(x => x.accountId === a.id && x.faction === 'polizei') : []; },
  async getPoliceApplications() { Cop.need(RANK_LEAD); return Store.get('applications', []).filter(a => a.faction === 'polizei').sort((a, b) => b.createdAt.localeCompare(a.createdAt)); },
  async decideApplication(no, status) {
    const me = Cop.need(RANK_LEAD); const l = Store.get('applications', []), a = l.find(x => x.appNo === no); if (!a) throw new Error('Bewerbung nicht gefunden.');
    if (status === 'angenommen') {
      const ch = Store.get('characters', []).find(c => c.id === a.charId); if (!ch) throw new Error('Der Charakter der Bewerbung existiert nicht mehr.');
      const off = Store.get('officers', []);
      if (!off.some(o => o.accountId === a.accountId)) { off.push({ accountId: a.accountId, charId: ch.id, rank: 'Anwärter', badge: this._badge(off), since: new Date().toISOString() }); Store.set('officers', off); }
    }
    a.status = status; a.decidedBy = `${me.rank} ${me.name}`; Store.set('applications', l);
  }
};

async function renderPublic(id, params) {
  document.title = (id === 'start' ? '' : PAGE_TITLES[id] + ' – ') + `Landespolizei ${CONFIG.LAND}`;
  let html; try { html = await PAGES[id](params); } catch (ex) { html = `<p class="p-8 text-red-600">Fehler beim Laden: ${esc(ex.message)}</p>`; }

// Suchfeld + Ergebnisliste (Filterung im Browser)
function searchList(el, { items, placeholder, text, row, emptyMsg, filter, limit = 60 }) {
  el.insertAdjacentHTML('beforeend', `<input type="search" data-q class="input mb-4 max-w-lg" placeholder="${esc(placeholder)}" autofocus><div data-list class="space-y-2"></div>`);
  const q = $('[data-q]', el), list = $('[data-list]', el);
  const draw = () => { const s = q.value.trim().toLowerCase(), rows = items.filter(i => (!filter || filter(i)) && (!s || text(i).toLowerCase().includes(s)));
    list.innerHTML = rows.length ? rows.slice(0, limit).map(row).join('') + (rows.length > limit ? `<p class="text-xs text-slate-500">… und ${rows.length - limit} weitere – Suche eingrenzen.</p>` : '') : empty(emptyMsg); };
  q.addEventListener('input', draw); draw();
}

// Zeile für einen Vorgang (Akte, Kennzeichen-Ansicht, Vorgangsliste)
/* ---- Akten: Konfiguration je Art ---- */
const AKTEN = {
  bericht:    { tab: 'berichte',   title: 'Berichte', lead: 'Streifen-, Unfall- und Ermittlungsberichte schreiben und nachschlagen.', add: 'Neuen Bericht schreiben', btn: 'Bericht speichern', ph: 'Betreff, Person, Kennzeichen, Text …' },
  festnahme:  { tab: 'festnahmen', title: 'Festnahmen', lead: 'Festnahmen dokumentieren – sie erscheinen in der Personenakte.', add: 'Festnahme erfassen', btn: 'Festnahme speichern', ph: 'Person, Tatvorwurf, Ort …' },
  asservat:   { tab: 'asservate',  title: 'Asservate & Beschlagnahmen', lead: 'Sichergestellte Gegenstände und Fahrzeuge dokumentieren und verwalten.', add: 'Beschlagnahme erfassen', btn: 'Beschlagnahme speichern', ph: 'Gegenstand, Person, Kennzeichen, Lagerort …' },
  vorstrafe:  { tab: 'vorstrafen', title: 'Vorstrafen', lead: 'Rechtskräftige Verurteilungen im Strafregister (Eintragen ab Dienstgrad Polizeimeister).', add: 'Vorstrafe eintragen', btn: 'Eintrag speichern', ph: 'Person, Straftat, Aktenzeichen …' }
};
const personField = (chars, pre, req, label) => `${charList('dl-p', chars)}<div><label class="label">${label}${req ? ' *' : ' (optional)'}</label><input name="person" list="dl-p" ${req ? 'required' : ''} class="input" placeholder="Name oder Bürger-ID" value="${pre ? esc(charOpt(pre)) : ''}"></div>`;
const locField = () => `<div><label class="label">Ort</label><select name="location" class="input">${STREETS.map(x => `<option>${x}</option>`).join('')}<option>Anderer Ort</option></select></div>`;
function aktenForm(kind, chars, pre, me) {
  const senior = rankIdx(me.rank) >= RANK_SENIOR, ta = (n, l, r, ph, rows = 4) => `<div class="sm:col-span-2"><label class="label">${l}${r ? ' *' : ''}</label><textarea name="${n}" ${r ? 'required' : ''} rows="${rows}" maxlength="1500" class="input" placeholder="${ph}"></textarea></div>`;
  let f = '';
  if (kind === 'bericht') f = `<div><label class="label">Art des Berichts</label><select name="sub" class="input">${REPORT_TYPES.map(t => `<option>${t}</option>`).join('')}</select></div><div><label class="label">Betreff *</label><input name="title" required maxlength="100" class="input" placeholder="z. B. Verkehrskontrolle Hauptstraße"></div>
    ${locField()}${personField(chars, pre, false, 'Beteiligte Person')}<div><label class="label">Kennzeichen (optional)</label><input name="plate" class="input uppercase" placeholder="NS AB 123"></div>${ta('text', 'Berichtstext', true, 'Was ist passiert? Maßnahmen, Beteiligte, Ergebnis …', 6)}`;
  if (kind === 'festnahme') f = `${personField(chars, pre, true, 'Festgenommene Person')}<div><label class="label">Tatvorwurf *</label><input name="offense" required maxlength="120" class="input" list="dl-o" placeholder="z. B. Raub, Fahren ohne Führerschein"><datalist id="dl-o">${OFFENSES.map(o => `<option value="${esc(o.name)}"></option>`).join('')}</datalist></div>
    ${locField()}${ta('text', 'Hergang', true, 'Wie kam es zur Festnahme? Beteiligte Beamte, Verhalten der Person …', 5)}
    ${senior ? '<label class="flex items-center gap-2 text-sm sm:col-span-2"><input type="checkbox" name="closeWarrant" checked> Bestehende Personenfahndung zu dieser Person beenden</label>' : ''}`;
  if (kind === 'asservat') f = `<div class="sm:col-span-2"><label class="label">Sichergestellte Gegenstände *</label><textarea name="items" required rows="2" maxlength="400" class="input" placeholder="z. B. 2 Schusswaffen, 5.000 € Bargeld, Fahrzeug …"></textarea></div>
    ${personField(chars, pre, false, 'Eigentümer / Beschuldigter')}<div><label class="label">Kennzeichen (bei Fahrzeug)</label><input name="plate" class="input uppercase" placeholder="NS AB 123"></div>${locField()}<div><label class="label">Lagerort</label><select name="storage" class="input">${STORAGES.map(x => `<option>${x}</option>`).join('')}</select></div>${ta('text', 'Grund der Beschlagnahme', true, 'Rechtsgrundlage, Fundumstände …', 3)}`;
  if (kind === 'vorstrafe') f = `${personField(chars, pre, true, 'Verurteilte Person')}<div><label class="label">Straftat *</label><input name="offense" required maxlength="120" class="input" placeholder="z. B. Schwerer Raub"></div>
    <div><label class="label">Strafart *</label><select name="sentence" class="input">${SENTENCE_TYPES.map(t => `<option>${t}</option>`).join('')}</select></div><div><label class="label">Höhe / Dauer</label><input name="sentenceDetail" maxlength="60" class="input" placeholder="z. B. 8 Monate, 2.500 €"></div>
    <div><label class="label">Aktenzeichen</label><input name="fileNo" maxlength="40" class="input" placeholder="optional"></div><div><label class="label">Datum des Urteils</label><input name="date" type="date" class="input" value="${new Date().toISOString().slice(0, 10)}"></div>${ta('text', 'Anmerkung', false, 'optional', 2)}`;
  return `<form data-submit="rec" class="grid gap-4 border-t border-slate-100 p-5 sm:grid-cols-2"><input type="hidden" name="kind" value="${kind}">${f}<div class="sm:col-span-2"><button class="btn-primary">${AKTEN[kind].btn}</button></div></form>`;
}
// Einzelner Eintrag (in Listen und in der Personenakte)
function recRow(r, me, withPerson = true) {
  const lead = rankIdx(me.rank) >= RANK_LEAD, senior = rankIdx(me.rank) >= RANK_SENIOR;
  const who = r.charName ? (withPerson ? `<a class="font-semibold text-cop-700 underline" href="#/person/${r.charId}">${esc(r.charName)}</a> <span class="text-slate-400">${esc(r.citizenId)}</span>` : '') : '';
  let head = '', body = '';
  if (r.kind === 'bericht') { head = `<b>${esc(r.title)}</b> ${badge(esc(r.sub || 'Bericht'))}`; body = `<p class="mt-1 whitespace-pre-line text-slate-600">${esc(r.text)}</p>`; }
  if (r.kind === 'festnahme') { head = `<b>${esc(r.offense)}</b> ${badge('Festnahme', C.bad)}`; body = `<p class="mt-1 whitespace-pre-line text-slate-600">${esc(r.text)}</p>`; }
  if (r.kind === 'asservat') { const st = SEIZE_STATUS[r.status] || SEIZE_STATUS.sichergestellt; head = `<b>${esc(r.items)}</b> ${badge(st.label, st.cls)}`; body = `<p class="mt-1 text-slate-600">${esc(r.text)}</p><p class="text-xs text-slate-500">Lagerort: ${esc(r.storage || '–')}${r.plate ? ' • ' + esc(r.plate) : ''}</p>`; }
  if (r.kind === 'vorstrafe') { head = `<b>${esc(r.offense)}</b> ${badge(esc(r.sentence), C.warn)}${r.sentenceDetail ? ' <span class="text-slate-600">' + esc(r.sentenceDetail) + '</span>' : ''}`; body = `<p class="text-xs text-slate-500">Urteil vom ${fmtDate(r.date)}${r.fileNo ? ' • Az. ' + esc(r.fileNo) : ''}</p>${r.text ? `<p class="mt-1 text-slate-600">${esc(r.text)}</p>` : ''}`; }
  const acts = (r.kind === 'asservat' && senior && r.status === 'sichergestellt' ? `<button data-act="recstatus" data-id="${r.id}" data-s="zurueck" class="btn-secondary !px-2.5 !py-1 text-xs">Zurückgeben</button><button data-act="recstatus" data-id="${r.id}" data-s="eingezogen" class="btn-secondary !px-2.5 !py-1 text-xs">Einziehen</button>` : '')
    + (lead ? `<button data-act="recdel" data-id="${r.id}" class="btn-secondary !px-2.5 !py-1 text-xs text-red-600">Löschen</button>` : '');
  return `<div class="rounded-lg border border-slate-200 bg-white p-3 text-sm"><div class="flex flex-wrap items-start justify-between gap-2"><div class="min-w-0">${head}${who ? `<p class="text-xs">${who}</p>` : ''}${body}
    <p class="mt-1 text-xs text-slate-400">${esc(r.id)}${r.location ? ' • ' + esc(r.location) : ''} • ${esc(r.by)} (${esc(r.badge || '')}) • ${fmtDT(r.createdAt)}</p></div><div class="flex gap-1">${acts}</div></div></div>`;
}
async function aktenView(el, params, me, kind) {
  const cfg = AKTEN[kind], [recs, chars] = await Promise.all([DB.getRecords(kind), DB.getCharacters()]);
  const creating = params[0] === 'neu', pre = creating ? chars.find(c => c.id === params[1]) : null, canAdd = kind !== 'vorstrafe' || rankIdx(me.rank) >= RANK_SENIOR;
  el.innerHTML = pageTitle(cfg.title, `${cfg.lead} • ${recs.length} Einträge`) +
    (canAdd ? `<details class="mb-5 rounded-xl border border-slate-200 bg-white shadow-sm" ${creating ? 'open' : ''}><summary class="cursor-pointer px-5 py-3 font-bold text-cop-700">${cfg.add}</summary>${aktenForm(kind, chars, pre, me)}</details>`
      : '<p class="mb-5 rounded-lg bg-slate-50 p-3 text-sm text-slate-600">Vorstrafen einsehen ist möglich – Eintragen erst ab Dienstgrad Polizeimeister.</p>');
  searchList(el, { items: recs, placeholder: cfg.ph, emptyMsg: 'Keine Einträge gefunden.', text: r => `${r.id} ${r.title} ${r.sub} ${r.text} ${r.offense} ${r.items} ${r.charName} ${r.citizenId} ${r.plate} ${r.by} ${r.fileNo} ${r.sentence}`, row: r => recRow(r, me) });
}

function caseRow(c, withPerson) {
  const me = Cop.officer(), cls = { offen: C.warn, bezahlt: C.ok, erlassen: '', erfasst: '' }[c.status] ?? '';
  return `<div class="rounded-lg border border-slate-100 bg-white p-3 text-sm ${withPerson ? 'border-slate-200 shadow-sm' : ''}"><div class="flex flex-wrap items-start justify-between gap-2"><div><b>${esc(c.type)}</b>${c.offense ? ' – ' + esc(c.offense) : ''} ${c.fine ? badge(euro(c.fine), C.info) : ''} ${badge(esc(c.status), cls)}
    ${withPerson ? `<p class="text-xs"><a class="font-semibold text-cop-700 underline" href="#/person/${c.charId}">${esc(c.charName)}</a> <span class="text-slate-400">${esc(c.citizenId)}</span>${c.plate ? ' • ' + esc(c.plate) : ''}</p>` : (c.plate ? `<p class="text-xs text-slate-500">${esc(c.plate)}</p>` : '')}
    <p class="mt-1 text-slate-600">${esc(c.text)}</p><p class="text-xs text-slate-400">${esc(c.id)} • ${esc(c.by)} (${esc(c.badge || '')}) • ${fmtDT(c.createdAt)}</p></div>
    <div class="flex gap-1">${c.status === 'offen' ? `<button data-act="casestatus" data-id="${c.id}" data-s="bezahlt" class="btn-secondary !px-2.5 !py-1 text-xs">Als bezahlt</button>${rankIdx(me.rank) >= RANK_SENIOR ? `<button data-act="casestatus" data-id="${c.id}" data-s="erlassen" class="btn-secondary !px-2.5 !py-1 text-xs">Erlassen</button>` : ''}` : ''}
      ${rankIdx(me.rank) >= RANK_LEAD ? `<button data-act="casedel" data-id="${c.id}" class="btn-secondary !px-2.5 !py-1 text-xs text-red-600">Löschen</button>` : ''}</div></div></div>`;

/* ------------------------------------------------------------------
   5) AKTIONEN (zentral per Event-Delegation – Buttons: data-act, Formulare: data-submit, Selects: data-change)

const ACT = {

  recstatus: async b => { await DB.setRecordStatus(b.dataset.id, b.dataset.s); toast('Status aktualisiert.', 'success'); render(); },
  recdel: async b => { if (!confirm('Eintrag endgültig löschen?')) return; await DB.removeRecord(b.dataset.id); toast('Eintrag gelöscht.', 'success'); render(); },
  wclose: async b => { await DB.closeWarrant(b.dataset.id); toast('Fahndung aufgehoben.', 'success'); render(); },
  vwanted: async b => { await DB.setVehicleWanted(b.dataset.id, b.dataset.on === '1'); toast('Fahrzeugfahndung aufgehoben.', 'success'); render(); },
  casestatus: async b => { await DB.setCaseStatus(b.dataset.id, b.dataset.s); toast('Status aktualisiert.', 'success'); render(); },
  casedel: async b => { if (!confirm('Vorgang endgültig löschen?')) return; await DB.removeCase(b.dataset.id); toast('Vorgang gelöscht.', 'success'); render(); },
  fire: async b => { if (!confirm(`${b.dataset.name} aus dem Dienst entlassen?`)) return; await DB.removeOfficer(b.dataset.id); toast('Beamter entlassen.', 'success'); render(); },
  tipstatus: async b => { await DB.setTipStatus(b.dataset.no, b.dataset.s); toast('Status aktualisiert.', 'success'); render(); },
  pressdel: async b => { if (!confirm('Meldung löschen?')) return; await DB.removePress(b.dataset.id); toast('Meldung gelöscht.', 'success'); render(); },
  appdecide: async b => { await DB.decideApplication(b.dataset.no, b.dataset.s); toast(b.dataset.s === 'angenommen' ? 'Bewerber angenommen – Dienstzugang eingerichtet.' : 'Bewerbung abgelehnt.', 'success'); render(); }
};
const SUB = {
  tipnote: async f => { const d = Object.fromEntries(new FormData(f)); await DB.addTipNote(d.no, d.text.trim(), d.pub === 'on'); toast('Notiz gespeichert.', 'success'); render(); },
  press: async f => { const d = Object.fromEntries(new FormData(f)); await DB.addPress({ title: d.title.trim(), tag: d.tag, text: d.text.trim() }); toast('Meldung veröffentlicht.', 'success'); render(); },
  tip: async f => { const d = Object.fromEntries(new FormData(f)); d.anonymous = d.anonymous === 'on'; const btn = f.querySelector('button'); btn.disabled = true;
    try { const no = await Public.submitTip(d); location.hash = '#/onlinewache/eingang/' + no; } catch (ex) { toast(ex.message, 'error'); btn.disabled = false; } },
  tipcheck: async f => { const d = Object.fromEntries(new FormData(f)); location.hash = '#/onlinewache/status/' + encodeURIComponent(d.no.trim().toUpperCase()); },
  login: async f => { const d = Object.fromEntries(new FormData(f)), er = $('#login-error'); er.classList.add('hidden');
    try { await DB.login(d.u, d.p); render(); } catch (ex) { er.textContent = ex.message; er.classList.remove('hidden'); } },
  duty: async f => { const d = Object.fromEntries(new FormData(f)), er = $('#duty-error'); er.classList.add('hidden');
    try { await DB.activateDuty(d.charId, d.code); toast('Dienstzugang freigeschaltet. Willkommen!', 'success'); location.hash = '#/dashboard'; render(); } catch (ex) { er.textContent = ex.message; er.classList.remove('hidden'); } },
  warrant: async f => { const d = Object.fromEntries(new FormData(f)), c = resolveChar(d.person, await DB.getCharacters());

  vwarrant: async f => { const d = Object.fromEntries(new FormData(f)), p = normPlate(d.plate), v = p && (await DB.getVehicles()).find(x => x.plate === p);
    if (!v) return toast('Kein zugelassenes Fahrzeug mit diesem Kennzeichen.', 'error');
    await DB.setVehicleWanted(v.id, true, d.reason.trim()); toast(`Fahrzeug ${p} ausgeschrieben.`, 'success'); location.hash = '#/fahndung'; render(); },
  newcase: async f => { const d = Object.fromEntries(new FormData(f)), c = resolveChar(d.person, await DB.getCharacters());
    if (!c) return toast('Person nicht gefunden – bitte aus der Liste wählen.', 'error');
    let plate = ''; if (d.plate.trim()) { plate = normPlate(d.plate); if (!plate) return toast('Ungültiges Kennzeichenformat.', 'error'); }
    await DB.addCase({ charId: c.id, type: d.type, plate, offense: d.offense, fine: d.fine, text: d.text.trim() }); toast('Vorgang gespeichert.', 'success'); location.hash = '#/vorgaenge'; render(); },
  rec: async f => { const d = Object.fromEntries(new FormData(f)), kind = d.kind, chars = await DB.getCharacters();
    let c = null; if ((d.person || '').trim()) { c = resolveChar(d.person, chars); if (!c) return toast('Person nicht gefunden – bitte aus der Liste wählen.', 'error'); }
    let plate = ''; if ((d.plate || '').trim()) { plate = normPlate(d.plate); if (!plate) return toast('Ungültiges Kennzeichenformat.', 'error'); }
    await DB.addRecord(kind, { ...d, charId: c ? c.id : null, plate, closeWarrant: d.closeWarrant === 'on' });
    toast('Eintrag gespeichert.', 'success'); location.hash = '#/' + AKTEN[kind].tab; render(); }
};
const CHG = {
  rank: async s => { await DB.setRank(s.dataset.id, s.value); toast('Dienstgrad geändert.', 'success'); render(); },
  offense: s => { const o = s.selectedOptions[0], f = s.closest('form'); if (!o || !o.dataset.fine) return; f.elements.fine.value = o.dataset.fine; f.elements.type.value = o.dataset.type; }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b); });
document.addEventListener('submit', e => { const f = e.target.closest('form[data-submit]'); if (f && SUB[f.dataset.submit]) { e.preventDefault(); SUB[f.dataset.submit](f); } });
document.addEventListener('change', e => { const s = e.target.closest('[data-change]'); if (s && CHG[s.dataset.change]) CHG[s.dataset.change](s); });
// Fehler aus Aktionen (z. B. fehlende Rechte) als Hinweis anzeigen
window.addEventListener('unhandledrejection', e => { e.preventDefault(); toast((e.reason && e.reason.message) || 'Unerwarteter Fehler.', 'error'); });

/* ------------------------------------------------------------------
   6) INIT
   ------------------------------------------------------------------ */
window.addEventListener('hashchange', render);
window.addEventListener('storage', e => { if (e.key && e.key.startsWith('np_') && !PAGES[(location.hash.replace(/^#\/?/, '').split('/')[0] || 'start')]) render(); });   // Änderungen aus dem Bürgerportal-Tab übernehmen
render();
</script>
